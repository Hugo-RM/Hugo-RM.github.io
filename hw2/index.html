<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blackjack</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="styles/style.css">
    <script src="js/script.js" defer></script>
</head>
<body class="text-center">
    <h1>Blackjack</h1>
    <p>Balance: $<span id="balance">500</span></p>
    
    <button id="deal-btn">Deal ($50)</button>
    
    <h2>Dealer: <span id="dealer-score"></span></h2>
    <div id="dealer-cards"></div>
    
    <h2>Player: <span id="player-score"></span></h2>
    <div id="player-cards"></div>
    
    <button id="hit-btn" disabled>Hit</button>
    <button id="stand-btn" disabled>Stand</button>
    
    <p id="message"></p>
</body>
</html>
