<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess a number</title>
    <link href="styles/style.css" rel="stylesheet"> 
    <script src="js/script.js" defer></script>
</head>
<body id="bodyStyle">
    <header>
        <div id="headerText" class="content">Guess the Number!</div>
    </header>

    <main>
        <div id="game">
            <div>
                <section class="content">
                    Guess: 
                    <input id="userGuess" type="text" size="5">
                    <button id="guessButton">Guess!</button>
                </section>
            </div>

            <div id="ansTextBox" class="content"></div>
            <br>
            <div id="message" class="content"></div>
            <br>
            <div id="endGame" class="content"></div>
        </div>
    </main>

</body>
</html>
